<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Día</title>
<meta name="theme-color" content="#2450E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Día">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo app móvil, cabecera con fecha, tarjetas por bloque y barra de pestañas fija abajo */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --ink:#142230; --muted:#5D6B78; --line:#D7DEE5; --chip:#E3E9EF;
  --accent:#2450E6; --accent-ink:#FFFFFF; --prot:#C9741F; --fib:#2F8F5B; --water:#1A8DB3; --warn:#C6452F; --ok:#2F8F5B; --low:#E0A800;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#17212B; --ink:#E7EDF2; --muted:#8C9AA7; --line:#26323E; --chip:#1F2A35;
  --accent:#7090FF; --accent-ink:#0E151C; --prot:#F0A04B; --fib:#4FBF80; --water:#4EC3E6; --warn:#FF7A63; --ok:#4FBF80; --low:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --ink:#E7EDF2; --muted:#8C9AA7; --line:#26323E; --chip:#1F2A35;
  --accent:#7090FF; --accent-ink:#0E151C; --prot:#F0A04B; --fib:#4FBF80; --water:#4EC3E6; --warn:#FF7A63; --ok:#4FBF80; --low:#F2C14E; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;padding-top:env(safe-area-inset-top,0px);min-height:100vh}
img{max-width:100%}[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px}
.lg{max-width:420px;margin:0 auto}
.lg h1{font-family:var(--f-num);font-size:34px;margin:8px 0 2px}
.lgicon{width:72px;height:72px;border-radius:16px;display:block}
#login .field input{background:var(--surface)}
input,select,textarea{font-size:16px!important}
details{margin-bottom:12px}summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:10px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:8px}
.datebox{flex:1;min-width:0;text-align:center}
.datebox .d{font-family:var(--f-num);font-weight:700;font-size:26px;letter-spacing:.01em;text-transform:capitalize;line-height:1.05}
.datebox .s{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.iconbtn[disabled]{opacity:.35;cursor:default}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-top:12px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .act{font-size:13px;letter-spacing:0;text-transform:none;color:var(--accent);background:none;border:0;padding:4px 0;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* resumen */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .big{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1}
.ring .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bars{flex:1;min-width:0;display:grid;gap:10px}
.bar .row{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.bar .row b{font-family:var(--f-num);font-size:16px;font-weight:600}
.bar .row span{color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:3px}
.fill{height:100%;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.stat .v{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
/* checklist */
.chk{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.box.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.box svg{width:15px;height:15px}
.chk .t{flex:1;min-width:0}
.chk .t small{display:block;color:var(--muted);font-size:12px}
.chk.done .t>span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.full{background:var(--ok);color:var(--surface)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.mbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.winput{width:96px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--f-num);font-size:18px}
/* comida */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.food{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.food .n{font-weight:600;font-size:14px;line-height:1.25}
.food .m{font-size:12px;color:var(--muted)}
.food .m b{font-family:var(--f-num);font-size:14px;color:var(--ink);font-weight:600}
.food .todo{font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
.slot{margin-top:12px}
.slot h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item .t{flex:1;min-width:0}
.item .t small{display:block;color:var(--muted);font-size:12px}
.item .k{font-family:var(--f-num);font-size:18px;font-weight:600;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);font-size:20px;width:32px;height:32px;border-radius:50%;flex:none}
.del:hover{background:var(--chip);color:var(--warn)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{flex:1;min-width:120px;border:0;border-radius:12px;padding:12px;font-weight:600;background:var(--chip)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
/* deporte */
.wbig{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wbig input{flex:1;min-width:120px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-family:var(--f-num);font-size:26px;font-weight:600}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted)}
/* progreso */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:12px}
.chart .grid line{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:2px}
.mc{aspect-ratio:1;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-family:var(--f-num);font-size:15px;font-weight:600;max-width:100%}
.mc.empty{background:transparent}.mc.fut{opacity:.4}
.mc.full{color:var(--surface)}
.mc.today{outline:2px solid var(--accent);outline-offset:1px}
.seg.mini2{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-transform:none;letter-spacing:0}
.seg.mini2 button{border:0;border-radius:0;padding:5px 12px;font-size:13px;background:transparent;color:var(--muted)}
.seg.mini2 button.on{background:var(--accent);color:var(--accent-ink)}
.okc{color:var(--ok)!important}
.dslot{padding:8px 0;border-top:1px solid var(--line)}.dslot:first-of-type{border-top:0}
.dhead{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:4px}
.dhead b{font-family:var(--f-num);font-size:15px;color:var(--ink);letter-spacing:0;text-transform:none}
.dline{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.dline span:first-child{min-width:0}.dline small{color:var(--muted)}
.dline .num{font-size:15px;white-space:nowrap}
.dtotal{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-weight:600}
.dtotal b{font-family:var(--f-num);font-size:22px}
.heat div{aspect-ratio:1;border-radius:5px;background:var(--chip);max-width:100%}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv b{font-family:var(--f-num);font-size:18px;font-weight:600}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;padding:6px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
/* hoja inferior */
.backdrop{position:fixed;inset:0;background:rgba(8,14,20,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h3{margin:0 0 12px;font-family:var(--f-num);font-size:24px;font-weight:700}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days{display:flex;gap:4px}
.days button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:700;padding:0}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.clrow{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:8px}
.clrow .top{display:flex;gap:8px;align-items:center}
.clrow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#fgrid{max-height:420px;overflow-y:auto}
.estb{font-size:12px;color:var(--muted);font-weight:700}
.macro{font-family:var(--f-num);font-size:14px;color:var(--muted);margin:12px 0 0;line-height:1.35;font-variant-numeric:tabular-nums}
.advice{white-space:pre-line;margin:0;font-size:14px;line-height:1.5}
.wreset{margin-top:12px;display:flex;justify-content:center}
.resetbtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:7px 16px;font-size:13px;font-weight:600}
.resetbtn:hover:not([disabled]){color:var(--warn);border-color:var(--warn)}
.resetbtn[disabled]{opacity:.45;cursor:default}
.warn{width:100%;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.warn b{color:var(--warn);font-size:14px}
.warn span{font-size:13px;color:var(--ink)}
.warn .btnrow{margin-top:8px}
.btn.danger-fill{background:var(--warn);color:var(--surface)}
.chart .vl{fill:var(--ink);font-size:11px;font-weight:600}
.chart .dn{font-size:10px}
.avg{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:13px;color:var(--muted)}
.avg b{font-family:var(--f-num);font-size:17px;color:var(--ink)}
.dlist{margin-top:6px}
.drow{width:100%;display:grid;grid-template-columns:1fr auto auto 64px;align-items:baseline;gap:10px;padding:9px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.drow:first-child{border-top:0}
.drow .dl{text-transform:capitalize;font-size:14px}
.drow .dp{font-size:12px;color:var(--muted)}
.drow b{font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.drow .dd2{font-family:var(--f-num);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.dd2.over{color:var(--warn)}.dd2.ok{color:var(--ok)}.dd2.under{color:var(--muted)}
.linkbtn{display:block;margin:10px auto 0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
.toast button{margin-left:12px;border:0;background:none;color:var(--water);font-weight:700;padding:0}
/* inicio */
.hello{padding-block:14px 0}
.greet{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.wkrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:2px}
.wkn{font-family:var(--f-num);font-weight:700;font-size:clamp(42px,13vw,60px);white-space:nowrap;min-width:0;line-height:.9;letter-spacing:-.01em}
.wkn small{font-size:20px;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0}
.wkmeta{text-align:right;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wkmeta b{display:block;font-family:var(--f-num);font-size:26px;color:var(--ok);letter-spacing:0;line-height:1}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.strip .dd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
.strip .dot{width:100%;max-width:42px;aspect-ratio:1;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-family:var(--f-num);font-size:16px;font-weight:600;color:var(--ink)}
.strip .today .dot{outline:2px solid var(--accent);outline-offset:2px}
.strip .fut .dot{opacity:.4}
.quote{margin:16px 0 0;padding:18px 18px 16px;background:var(--surface);border-radius:var(--r)}
.quote .qm{font-family:var(--f-num);font-weight:700;font-size:60px;line-height:.6;height:24px;display:block;color:var(--accent)}
.quote p{margin:0;font-size:19px;line-height:1.35;font-weight:500;text-wrap:balance}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:13px;color:var(--muted)}
.quote .qnext{float:right;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:2px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.abtn{border:0;border-radius:var(--r);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:0}
.abtn.pri{background:var(--accent);color:var(--accent-ink)}
.abtn svg{width:28px;height:28px;margin-bottom:4px}
.abtn b{font-size:15px;line-height:1.2}
.abtn span{font-size:12px;opacity:.75;line-height:1.3}
.water{position:relative}
.glass{position:relative;height:60px;border-radius:14px;background:var(--chip);overflow:hidden;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.glass .wfill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(180deg,color-mix(in srgb,var(--water) 55%,var(--surface)),var(--water))}
.glass .wfill::after{content:"";position:absolute;top:0;right:-1px;bottom:0;width:3px;background:var(--surface);opacity:.6}
.glass .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:600;font-size:14px;pointer-events:none}
.glass .lab b{font-family:var(--f-num);font-size:28px;font-weight:700}
.gscale{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:12px;color:var(--muted);margin-top:4px;padding:0 2px}
.fallgap{height:46px}
.tankrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:5px}
.tankrow b{font-family:var(--f-num);font-size:20px;color:var(--ink);font-weight:600}
.tank{position:relative;height:26px;border-radius:13px;background:var(--chip);overflow:hidden}
.tank .tfill{position:absolute;top:0;bottom:0;left:0;background:var(--water);border-radius:13px}
.tank .goal{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.7}
.wdrop{position:absolute;left:0;top:0;width:11px;height:11px;background:var(--water);border-radius:0 50% 50% 50%;pointer-events:none;z-index:4;will-change:transform}
.today-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zone{display:grid;place-items:center;min-height:150px;border:2px dashed var(--line);border-radius:14px;background:var(--bg);color:var(--muted);font-weight:600;text-align:center;padding:12px;cursor:pointer;margin-bottom:12px;overflow:hidden}
.zone img{max-height:220px;border-radius:10px;object-fit:cover}
.zone .thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.zone .thumbs img{max-height:140px;max-width:46%}
.est{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.est .top{display:flex;gap:8px;align-items:center}
.est .top input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.est .f3 input{padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.est .f3 label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.conf{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.conf.baja{color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);padding:10px 0}
.thinking i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.fill,.ring circle{transition:width .35s ease,stroke-dashoffset .45s ease}}

const DEF_AI={rules:[],typical:[],notes:[]};

function slotNow(h=new Date().getHours()){return h<6?'mad':h<12?'man':h<16?'med':h<20?'tar':'noc'}
function pickQuote(){
  const sl=slotNow(), pool=QUOTES.map((q,i)=>i).filter(i=>QUOTES[i].s.includes(sl));
  let last=null;try{last=JSON.parse(localStorage.getItem('midia:lastq'))}catch(e){}
  let opts=pool.filter(i=>i!==last);if(!opts.length)opts=pool;
  const i=opts[Math.floor(Math.random()*opts.length)];
  try{localStorage.setItem('midia:lastq',JSON.stringify(i))}catch(e){}
  return {i,slot:sl};
}
const DEF_FOODS=[
  {id:'f-mac',name:'Macarrones v3',unit:'tupper',kcal:565,p:26,fib:null},
  {id:'f-tik',name:'Tikka v2 cremoso',unit:'tupper',kcal:400,p:55,fib:null},

  {id:'f-top',name:'Postre TOP',unit:'bol',kcal:null,p:null,fib:null,note:'queso batido + whey + granola'}

  {id:'c-omega',label:'Omega-3',days:null},
  {id:'c-crea',label:'Creatina',note:'vaso amarillo',days:null},
  {id:'c-kiwi',label:'Kiwi',days:null},
  {id:'c-ferm',label:'Lácteo fermentado',days:null},
  {id:'c-paseo',label:'Paseo post-comida',note:'10–15 min',days:null},
  {id:'c-pesaje',label:'Pesaje del lunes',note:'en ayunas, mismas condiciones',days:[1],weigh:true}
];
const SLOTS=['Desayuno','Comida','Merienda','Cena','Snack'];
const DOW=[[1,'L'],[2,'M'],[3,'X'],[4,'J'],[5,'V'],[6,'S'],[0,'D']];

const S={ai:{...DEF_AI},fq:'',fcat:'hab',goals:{...DEF_GOALS},foods:DEF_FOODS.map(f=>({...f})),checklist:DEF_CHECK.map(c=>({...c})),days:{},date:key(new Date()),tab:'inicio',online:false,loaded:false,quote:pickQuote(),anim:false,dirty:false};
let sheetCtx=null;

/* ---------- utilidades ---------- */
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function r0(n){return Math.round(n||0)}
function fmt(n){return r0(n).toLocaleString('es-ES')}
function fmt1(n){return (Math.round(n*10)/10).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})}
function uid(p){return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function num(v){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function today(){return key(new Date())}

/* ---------- almacenamiento ---------- */
const LS='midia:';
function lsGet(k){try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
/* sincronización con Supabase: tabla docs(user_id, path, data) */
let sb=null, sess=null, flushing=false, syncErr=false, lastSync=null;
function pend(){return lsGet('_pending')||{}}
function setPend(p){lsSet('_pending',p)}
function save(path,data){
  lsSet(path,data);
  const p=pend();p[path]=Date.now();setPend(p);
  clearTimeout(save._t);save._t=setTimeout(flush,400);
}
async function flush(){
  if(flushing||!sb||!sess)return; flushing=true;
  try{
    const p=pend(),paths=Object.keys(p);
    if(paths.length){
      const rows=paths.map(path=>({user_id:sess.user.id,path,data:lsGet(path)||{},updated_at:new Date().toISOString()}));
      const {error}=await sb.from('docs').upsert(rows,{onConflict:'user_id,path'});
      if(error)throw error;
      const now=pend();paths.forEach(k=>{if(now[k]===p[k])delete now[k]});setPend(now);
    }
    syncErr=false;lastSync=Date.now();
  }catch(e){syncErr=true}
  flushing=false;renderSync();
  if(Object.keys(pend()).length&&!syncErr)flush();
}
function applyDoc(path,data){
  if(path==='cfg/goals')S.goals={...DEF_GOALS,...data};
  else if(path==='cfg/foods'){if(Array.isArray(data.items))S.foods=data.items}
  else if(path==='cfg/checklist'){if(Array.isArray(data.items))S.checklist=data.items}
  else if(path==='cfg/ai')S.ai={...DEF_AI,...data};
  else if(path.startsWith('days/'))S.days[path.slice(5)]=data;
}
async function pull(){
  if(!sb||!sess)return;
  try{
    const p=pend();let from=0;const size=1000;
    while(true){
      const {data,error}=await sb.from('docs').select('path,data').range(from,from+size-1);
      if(error)throw error;
      data.forEach(r=>{if(p[r.path])return;lsSet(r.path,r.data);applyDoc(r.path,r.data)});
      if(data.length<size)break;from+=size;
    }
    syncErr=false;lastSync=Date.now();S.loaded=true;
  }catch(e){syncErr=true}
  render();flush();
}
function loadLocal(){
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith(LS))continue;const path=k.slice(LS.length);
    if(path.startsWith('cfg/')||path.startsWith('days/')){const v=lsGet(path);if(v)applyDoc(path,v)}}}catch(e){}
}
function syncText(){
  const n=Object.keys(pend()).length;
  if(!sess)return 'Sin sesión';
  if(!navigator.onLine)return n?`Sin conexión · ${n} cambio${n>1?'s':''} pendiente${n>1?'s':''} de subir`:'Sin conexión · tus datos están en este móvil';
  if(syncErr)return 'No se pudo sincronizar · se reintentará';
  if(n)return 'Guardando…';
  return 'Sincronizado en tu cuenta';
}
function renderSync(){const e=document.getElementById('syncLine');if(e)e.textContent=syncText()}

/* ---------- conexión y acceso ---------- */
function cfgGet(){const c=window.MIDIA_CONFIG||{};let u=null,k=null;try{u=localStorage.getItem('midia:_sbUrl');k=localStorage.getItem('midia:_sbKey')}catch(e){}
  return {url:(u||c.supabaseUrl||'').trim(),key:(k||c.supabaseAnonKey||'').trim()}}
function makeClient(){const c=cfgGet();if(!c.url||!c.key||!window.supabase)return null;
  try{return window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'midia-auth'}})}catch(e){return null}}
async function connect(){
  sb=makeClient();
  if(!sb){showLogin();return}
  const {data}=await sb.auth.getSession();sess=data&&data.session;
  if(!sess){showLogin();return}
  sb.auth.onAuthStateChange((ev,se)=>{sess=se;if(!se&&ev==='SIGNED_OUT')showLogin()});
  hideLogin();pull();
}
function showLogin(msg){
  const c=cfgGet(),has=!!(c.url&&c.key);
  document.getElementById('login').hidden=false;
  document.getElementById('login').innerHTML=`<div class="lg"><img src="icons/icon-192.png" alt="" class="lgicon"><h1>Mi Día a Día</h1><p class="note">Entra con tu cuenta para sincronizar tus datos.</p>
    <form id="lgForm">
      <div class="field"><label for="lgMail">Email</label><input id="lgMail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lgPass">Contraseña</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
      <details ${has?'':'open'}><summary>Servidor (Supabase)</summary>
        <div class="field"><label for="lgUrl">Project URL</label><input id="lgUrl" value="${esc(c.url)}" placeholder="https://xxxx.supabase.co" autocapitalize="off"></div>
        <div class="field"><label for="lgKey">Clave pública (anon / publishable)</label><input id="lgKey" value="${esc(c.key)}" autocapitalize="off"></div>
      </details>
      <p class="note" id="lgMsg" style="color:var(--warn)">${esc(msg||'')}</p>
      <button class="btn pri" type="submit" style="width:100%">Entrar</button>
    </form></div>`;
}
function hideLogin(){const l=document.getElementById('login');l.hidden=true;l.innerHTML=''}
async function doLogin(e){
  e.preventDefault();const m=document.getElementById('lgMsg');
  const url=val('lgUrl').trim().replace(/\/+$/,''),key=val('lgKey').trim();
  if(!/^https:\/\/.+/.test(url)||!key){m.textContent='Rellena la URL y la clave del servidor.';return}
  try{localStorage.setItem('midia:_sbUrl',url);localStorage.setItem('midia:_sbKey',key)}catch(_){}
  sb=makeClient();if(!sb){m.textContent='No se pudo conectar con ese servidor.';return}
  m.style.color='var(--muted)';m.textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email:val('lgMail').trim(),password:val('lgPass')});
  if(error){m.style.color='var(--warn)';m.textContent=error.message&&/invalid/i.test(error.message)?'Email o contraseña incorrectos.':'No se pudo entrar: '+(error.message||'error');return}
  sess=data.session;sb.auth.onAuthStateChange((ev,se)=>{sess=se});hideLogin();pull();
}
async function logout(){if(sb)await sb.auth.signOut();sess=null;showLogin()}
window.addEventListener('online',()=>{renderSync();flush();pull()});
window.addEventListener('offline',renderSync);
setInterval(()=>{if(document.visibilityState==='visible'&&sess){flush()}},60000);

/* ---------- modelo del día ---------- */
function blank(){return {meals:[],workouts:[],steps:0,water:0,checks:{},weight:null}}
function day(k=S.date){const d=S.days[k];return d?{...blank(),...d}:blank()}
function updDay(fn,k=S.date){
  const d=JSON.parse(JSON.stringify(day(k)));
  fn(d); S.days[k]=d; save('days/'+k,d); render();
}
function totals(d){
  return d.meals.reduce((a,m)=>({kcal:a.kcal+(m.kcal||0),p:a.p+(m.p||0),hc:a.hc+(m.hc||0),gr:a.gr+(m.gr||0),fib:a.fib+(m.fib||0)}),{kcal:0,p:0,hc:0,gr:0,fib:0});
}
function burned(d){return d.workouts.reduce((a,w)=>a+(w.kcal||0),0)}
function itemsFor(k){const dw=parse(k).getDay();return S.checklist.filter(c=>!c.days||!c.days.length||c.days.includes(dw))}
function progress(k){
  const d=day(k), items=itemsFor(k);
  let done=items.filter(c=>d.checks[c.id]).length;
  const total=items.length+1; if(d.water>=S.goals.water)done++;
  return {done,total};
}

/* ---------- render ---------- */
const ICON={
  hoy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
  comida:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v9M4 2v5a3 3 0 0 0 6 0V2M7 11v11"/><path d="M17 2c-2 2-3 5-3 8h3v12"/></svg>',
  deporte:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>',
  inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  progreso:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>'
};
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function render(){
  if(S.anim){S.dirty=true;return}
  const nav=document.getElementById('nav');
  nav.innerHTML=[['inicio','Inicio'],['hoy','Hoy'],['comida','Comida'],['deporte','Deporte'],['progreso','Progreso']].map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${S.tab===k?'on':''}" aria-current="${S.tab===k?'page':'false'}">${ICON[k]}${l}</button>`).join('');
  if(S.tab==='inicio'){
    document.getElementById('app').innerHTML=vInicio()+`<div class="sync" id="syncLine">${syncText()}</div>`;
    bindWater();return;
  }
  const isToday=S.date===today();
  const d=parse(S.date);
  const label=isToday?'Hoy':S.date===addDays(today(),-1)?'Ayer':d.toLocaleDateString('es-ES',{weekday:'long'});
  const sub=d.toLocaleDateString('es-ES',{weekday:isToday?'long':undefined,day:'numeric',month:'long'});
  let h=`<header class="top"><button class="iconbtn" data-act="prev" aria-label="Día anterior">‹</button>
    <div class="datebox"><div class="d">${esc(label)}</div><div class="s">${esc(sub)}${!isToday?' · <a href="#" data-act="today" style="color:var(--accent)">ir a hoy</a>':''}</div></div>
    <button class="iconbtn" data-act="next" aria-label="Día siguiente" ${isToday?'disabled':''}>›</button></header>`;
  h+=({hoy:vHoy,comida:vComida,deporte:vDeporte,progreso:vProgreso})[S.tab]();
  h+=`<div class="sync" id="syncLine">${syncText()}</div>`;
  document.getElementById('app').innerHTML=h;
}

/* ---------- inicio ---------- */
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const SCAN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>';
function vInicio(){
  const tk=today(), g=S.goals, d=day(tk), t=totals(d);
  const h=new Date().getHours();
  const greet=h<6?'Turno de noche, Rubén':h<14?'Buenos días, Rubén':h<21?'Buenas tardes, Rubén':'Buenas noches, Rubén';
  const st=g.start||DEF_GOALS.start;
  const dd=Math.floor((parse(tk)-parse(st))/864e5);
  const wk=Math.max(1,Math.floor(dd/7)+1), dow=(parse(tk).getDay()+6)%7;
  const wts=Object.keys(S.days).filter(k=>S.days[k]&&S.days[k].weight!=null).sort();
  let lost='';if(wts.length>1){const df=S.days[wts[0]].weight-S.days[wts[wts.length-1]].weight;lost=`<div class="wkmeta">${df>=0?'Llevas':'Diferencia'}<b>${df>=0?'−':'+'}${fmt1(Math.abs(df))} kg</b></div>`}
  let mon=addDays(tk,-dow);
  const lo=g.kcal-100,hi=g.kcal+100;
  const strip=DOW.map(([n,l],i)=>{const k=addDays(mon,i),fut=k>tk,kc=fut?0:totals(day(k)).kcal;
    const st=!kc?'':kc<lo?'low':kc>hi?'over':'ok';

function bindWater(){
  const g=document.getElementById('glass');if(!g)return;
  const fill=document.getElementById('gfill'),lab=document.getElementById('gml'),hint=document.getElementById('glab');
  let ml=0,drag=false;
  const setMl=v=>{ml=Math.max(0,Math.min(1000,Math.round(v/50)*50));fill.style.width=ml/10+'%';lab.textContent=ml+' ml';
    g.setAttribute('aria-valuenow',ml);g.setAttribute('aria-valuetext',ml+' ml');hint.textContent=ml?(drag?'Suelta para beber':'Enter para beber'):'Desliza y suelta para beber'};
  const fx=e=>{const r=g.getBoundingClientRect();return (e.clientX-r.left)/r.width*1000};
  g.addEventListener('pointerdown',e=>{drag=true;try{g.setPointerCapture(e.pointerId)}catch(_){}setMl(fx(e))});
  g.addEventListener('pointermove',e=>{if(drag)setMl(fx(e))});
  const up=()=>{if(!drag)return;drag=false;if(ml>=50)pour(ml);else setMl(0)};
  g.addEventListener('pointerup',up);g.addEventListener('pointercancel',()=>{drag=false;setMl(0)});
  g.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();setMl(ml+50)}
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();setMl(ml-50)}
    else if((e.key==='Enter'||e.key===' ')&&ml>=50){e.preventDefault();pour(ml)}
  });
}
function pour(ml){
  const tk=today(),goal=S.goals.water;
  const d=JSON.parse(JSON.stringify(day(tk)));const before=d.water||0;d.water=before+ml;
  S.days[tk]=d;save('days/'+tk,d);
  const p0=Math.min(100,before/goal*100),p1=Math.min(100,d.water/goal*100);
  const card=document.getElementById('waterCard'),g=document.getElementById('glass'),gf=document.getElementById('gfill'),
        tank=document.getElementById('tank'),tf=document.getElementById('tfill'),tml=document.getElementById('tml');
  const done=()=>{S.anim=false;S.dirty=false;render();
    toast(`+${ml} ml · ${fmt1(d.water/1000)} L hoy`,{label:'Deshacer',fn:()=>updDay(x=>{x.water=Math.max(0,(x.water||0)-ml)},tk)})};
  if(RM.matches||!card||!card.animate){done();return}
  S.anim=true;
  const cr=card.getBoundingClientRect(),gr=g.getBoundingClientRect(),tr=tank.getBoundingClientRect();
  const fw=gr.width*ml/1000,n=Math.min(18,5+Math.round(ml/70)),step=60;
  const y0=gr.bottom-cr.top-10,y1=tr.top-cr.top+6;
  const edge=tr.left-cr.left+tr.width*p0/100;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='wdrop';card.appendChild(el);
    const x=gr.left-cr.left+Math.max(4,Math.min(fw-8,fw*(1-(i+0.5)/n)+(Math.random()-.5)*14));
    const tx=x+(Math.max(edge,tr.left-cr.left+8)-x)*0.25+(Math.random()-.5)*10;
    const s=0.7+Math.random()*0.6;
    el.animate([
      {transform:`translate(${x}px,${y0}px) rotate(45deg) scale(${s*.4})`,opacity:0},
      {transform:`translate(${x}px,${y0+6}px) rotate(45deg) scale(${s})`,opacity:1,offset:.12},
      {transform:`translate(${tx}px,${y1}px) rotate(45deg) scale(${s})`,opacity:1,offset:.88},
      {transform:`translate(${tx}px,${y1+6}px) rotate(45deg) scale(${s*1.6},${s*.3})`,opacity:0}
    ],{duration:620,delay:i*step,easing:'cubic-bezier(.55,0,.85,.55)',fill:'both'}).finished.then(()=>el.remove(),()=>el.remove());
  }
  const drain=n*step+250;
  gf.animate([{width:ml/10+'%'},{width:'0%'}],{duration:drain,easing:'linear',fill:'forwards'});
  const fillDur=drain;
  tf.animate([{width:p0+'%'},{width:p1+'%'}],{duration:fillDur,delay:420,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'});
  const t0=performance.now()+420;
  const tick=now=>{const k=Math.max(0,Math.min(1,(now-t0)/fillDur));tml.textContent=`${fmt1((before+ml*k)/1000)} / ${fmt1(goal/1000)} L`;if(k<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
  setTimeout(done,420+fillDur+150);
}

const MODELS=[['claude-sonnet-5-5','Sonnet 5.5 · más preciso'],['claude-haiku-4-5-20251001','Haiku 4.5 · más barato']];
function aiKey(){try{return localStorage.getItem('midia:_aiKey')||''}catch(e){return ''}}
function aiModel(){try{return localStorage.getItem('midia:_aiModel')||MODELS[0][0]}catch(e){return MODELS[0][0]}}
function b64(blob){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(blob)})}
async function aiCall(prompt,opts={}){
  const key=aiKey();if(!key)throw {code:'no_key'};
  const content=[];
  for(const im of (opts.images||[])){content.push({type:'image',source:{type:'base64',media_type:im.type&&/png|webp|gif/.test(im.type)?im.type:'image/jpeg',data:await b64(im)}})}
  content.push({type:'text',text:prompt+(opts.json?'\n\nTu respuesta se procesará automáticamente: responde únicamente con el JSON, sin texto antes ni después.':'')});
  let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:opts.model||aiModel(),max_tokens:opts.max||2000,messages:[{role:'user',content}]})})}
  catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:navigator.onLine?'upstream_error':'offline'}}
  let body=null;try{body=await res.json()}catch(e){}
  if(!res.ok){const msg=(body&&body.error&&body.error.message)||'';
    if(res.status===401)throw {code:'bad_key'};
    if(/credit balance/i.test(msg))throw {code:'no_credit'};
    if(res.status===429)throw {code:'rate_limited'};
    if(res.status===529||res.status>=500)throw {code:'upstream_error'};
    throw {code:'api_error',message:msg}}
  const text=(body.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  if(!text)throw {code:'empty_completion'};
  if(opts.onText)try{opts.onText({text,delta:text})}catch(e){}
  return {text,truncated:body.stop_reason==='max_tokens'};
}
function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)try{return JSON.parse(f[1])}catch(e){}
  const a=Math.min(...['{','['].map(c=>{const i=t.indexOf(c);return i<0?1e9:i})),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a<1e9&&b>a)try{return JSON.parse(t.slice(a,b+1))}catch(e){}
  throw {code:'invalid_json',text:t};
}
function getSample(){
  if(!aiKey())return Promise.resolve(null);
  const f=(p,o)=>aiCall(p,o);

async function toJpeg(file){
  try{
    let src,w,h,bmp=null,img=null;
    if(window.createImageBitmap){try{bmp=await createImageBitmap(file)}catch(e){bmp=null}}
    if(bmp){w=bmp.width;h=bmp.height;src=bmp}
    else{const url=URL.createObjectURL(file);img=new Image();await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url});w=img.naturalWidth;h=img.naturalHeight;src=img}
    const k=Math.min(1,1600/Math.max(w,h)),cw=Math.round(w*k),ch=Math.round(h*k);
    const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(src,0,0,cw,ch);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob&&blob.size?blob:file;
  }catch(e){return file}
}

function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}

function weightChart(){
  const pts=Object.keys(S.days).filter(k=>S.days[k]&&S.days[k].weight!=null).sort().map(k=>({k,w:S.days[k].weight}));
  if(pts.length<2)return `<p class="empty">${pts.length?'Con el próximo pesaje verás la curva.':'Anota tu peso en la checklist del lunes y aquí verás la evolución.'}</p>`;
  const W=340,H=170,L=34,R=10,T=12,B=24;
  const t0=parse(pts[0].k).getTime(),t1=parse(pts[pts.length-1].k).getTime();
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  lo=Math.floor(lo-0.5);hi=Math.ceil(hi+0.5);
  const x=k=>L+(W-L-R)*((parse(k).getTime()-t0)/(t1-t0||1));
  const y=w=>T+(H-T-B)*(1-(w-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((p,i)=>(i?'L':'M')+x(p.k).toFixed(1)+' '+y(p.w).toFixed(1)).join(' ');
  const area=path+` L${x(pts[pts.length-1].k).toFixed(1)} ${H-B} L${x(pts[0].k).toFixed(1)} ${H-B} Z`;
  const f=k=>parse(k).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    <g class="grid">${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt1(v)}</text>`).join('')}</g>

function kcalChart(){
  const W=340,H=184,L=6,R=6,T=18,B=42,n=14,g=S.goals.kcal;
  const ks=[...Array(n)].map((_,i)=>addDays(S.date,i-n+1));
  const tt=ks.map(k=>totals(day(k))),vals=tt.map(t=>t.kcal);
  const max=Math.max(g*1.25,...vals);
  const bw=(W-L-R)/n, y=v=>T+(H-T-B)*(1-v/max);
  const kf=v=>v>=1000?(Math.round(v/100)/10).toLocaleString('es-ES',{minimumFractionDigits:1}):String(Math.round(v));
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kcal de los últimos 14 días">
    <line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    ${vals.map((v,i)=>{const bx=L+i*bw+bw*.16,w=bw*.68,yy=y(v),cx=bx+w/2,d=parse(ks[i]);const pOk=tt[i].p>=S.goals.p;
      return `<rect x="${bx}" y="${yy}" width="${w}" height="${Math.max(0,H-B-yy)}" rx="3" fill="${v>g*1.05?'var(--warn)':'var(--accent)'}" opacity="${v?1:.25}"/>
      ${v?`<text x="${cx}" y="${yy-5}" text-anchor="middle" class="vl">${kf(v)}</text>`:''}
      <text x="${cx}" y="${H-19}" text-anchor="middle">${'DLMXJVS'[d.getDay()]}</text>
      <text x="${cx}" y="${H-7}" text-anchor="middle" class="dn">${d.getDate()}</text>
      ${pOk?`<circle cx="${cx}" cy="${H-B+6}" r="2.5" fill="var(--prot)"/>`:''}`}).join('')}
  </svg>`;
  const withData=ks.map((k,i)=>({k,t:tt[i]})).filter(x=>x.t.kcal>0);
  const avg=withData.length?withData.reduce((a,x)=>a+x.t.kcal,0)/withData.length:0;
  const wP=withData.filter(x=>x.t.p>0);const avgP=wP.length?wP.reduce((a,x)=>a+x.t.p,0)/wP.length:0;
  const rows=ks.map((k,i)=>({k,t:tt[i]})).reverse().map(({k,t})=>{
    const d=parse(k),lbl=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
    const diff=t.kcal-g;
    return `<button class="drow" data-act="goDay" data-v="${k}"><span class="dl">${esc(lbl)}</span>
      ${t.kcal?`<span class="dp">${t.p?fmt(t.p)+' P':''}</span><b>${fmt(t.kcal)}</b><span class="dd2 ${diff>g*.05?'over':diff<-g*.15?'under':'ok'}">${diff>0?'+':diff<0?'−':''}${fmt(Math.abs(diff))}</span>`:'<span class="dp">sin registro</span><b>–</b><span class="dd2"></span>'}</button>`}).join('');
  return svg+`<div class="legend"><span><i style="background:var(--accent)"></i>Dentro de objetivo</span><span><i style="background:var(--warn)"></i>Por encima</span><span><i style="background:var(--prot);border-radius:50%"></i>Proteína cumplida</span><span>Cifras en miles de kcal</span></div>
    <div class="avg"><span>Media de ${withData.length} ${withData.length===1?'día':'días'} con registro</span><b>${fmt(avg)} kcal${avgP?` · ${fmt(avgP)} P`:''}</b></div>
    <div class="dlist">${rows}</div>`;
}

function monthStreak(){
  const base=parse(S.date),y=base.getFullYear(),mo=base.getMonth(),tk=today();
  const first=key(new Date(y,mo,1)),nd=new Date(y,mo+1,0).getDate();
  const full=k=>{if(!S.days[k])return false;const p=progress(k);return p.done===p.total};
  // racha actual dentro del mes: días seguidos completos hasta hoy (o ayer si hoy aún no está completo)
  let streak=0,k=tk<key(new Date(y,mo,nd))?tk:key(new Date(y,mo,nd));
  if(k.slice(0,7)!==first.slice(0,7))k=key(new Date(y,mo,nd));
  if(!full(k))k=addDays(k,-1);
  while(k>=first&&full(k)){streak++;k=addDays(k,-1)}
  let done=0;for(let d=1;d<=nd;d++){if(full(key(new Date(y,mo,d))))done++}
  const lead=(new Date(y,mo,1).getDay()+6)%7;
  const title=base.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let cells='';for(let i=0;i<lead;i++)cells+='<div class="mc empty"></div>';
  for(let d=1;d<=nd;d++){const kk=key(new Date(y,mo,d)),fut=kk>tk,p=progress(kk),has=!!S.days[kk]&&!fut;
    const r=has?p.done/p.total:0,cls=fut?'fut':has&&r===1?'full':has&&r>0?'part':'';
    const bg=cls==='full'?'var(--ok)':cls==='part'?`color-mix(in srgb, var(--ok) ${Math.round(20+r*50)}%, var(--chip))`:'';
    cells+=`<div class="mc ${cls} ${kk===tk?'today':''}" title="${kk}: ${has?p.done+'/'+p.total:'sin datos'}" ${bg?`style="background:${bg}"`:''}>${d}</div>`}
  return `<section class="card"><h2><span style="text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)">Racha de ${esc(title)}</span><span class="pill ${streak?'full':''}">${streak} ${streak===1?'día':'días'} seguidos</span></h2>
    <div class="mgrid">${['L','M','X','J','V','S','D'].map(l=>`<div class="mh">${l}</div>`).join('')}${cells}</div>
    <div class="avg"><span>Días con la checklist completa</span><b>${done} / ${nd}</b></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Completa</span><span><i style="background:color-mix(in srgb, var(--ok) 40%, var(--chip))"></i>A medias</span><span>Se reinicia cada día 1</span></div></section>`;
}

  h+=backupCard();

  const k=['kcal','p','hc','gr','fib'],o={};

    <div class="f3"><div class="field"><label for="gw">Agua L</label><input id="gw" inputmode="decimal" value="${fmt1(g.water/1000)}"></div>
    <div class="field"><label for="gs">Pasos</label><input id="gs" inputmode="numeric" value="${g.steps}"></div><div></div></div>
    <div class="field"><label for="gst">Inicio del proceso (semana 1)</label><input id="gst" type="date" value="${g.start||DEF_GOALS.start}"></div>
    <div class="btnrow"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="goalsSave">Guardar</button></div>`);
}
function clRows(){
  return sheetCtx.items.map((c,i)=>`<div class="clrow"><div class="top"><input id="cl-${i}" value="${esc(c.label)}" aria-label="Tarea"><button class="del" data-act="clDel" data-i="${i}" aria-label="Borrar tarea">×</button></div>
    <div class="days">${DOW.map(([n,l])=>`<button data-act="clDay" data-i="${i}" data-v="${n}" class="${!c.days||!c.days.length||c.days.includes(n)?'on':''}" aria-label="${l}">${l}</button>`).join('')}</div></div>`).join('');
}
function openCl(){
  openSheet(`<h3>Editar checklist</h3><p class="empty" style="margin-top:-8px">Marca los días en que aparece cada tarea. El agua se controla aparte con tu objetivo.</p>
    <div id="clList">${''}</div>
    <div class="btnrow"><button class="btn" data-act="clAdd">+ Tarea</button></div>
    <div class="btnrow"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="clSave">Guardar</button></div>`,{items:S.checklist.map(c=>({...c,days:c.days?[...c.days]:null}))});
  document.getElementById('clList').innerHTML=clRows();
}
function clSync(){sheetCtx.items.forEach((c,i)=>{const e=document.getElementById('cl-'+i);if(e)c.label=e.value})}

/* ---------- acciones ---------- */
const A={
  tab:t=>{S.tab=t.dataset.v;if(S.tab==='inicio')S.quote=pickQuote();render();scrollTo(0,0)},
  qnext:()=>{S.quote=pickQuote();render()},
  photo:openPhoto, scan:openScan, phGo:()=>phGo(), scGo:()=>scGo(),
  aiStop:()=>{if(sheetCtx&&sheetCtx.ctl)sheetCtx.ctl.abort()},
  estDel:t=>{estSync();sheetCtx.items.splice(Number(t.dataset.i),1);renderEst()},
  phAdd:()=>{estSync();const slot=val('phSlot'),it=sheetCtx.items.filter(x=>x.name.trim());closeSheet();
    updDay(d=>it.forEach(x=>d.meals.push({id:uid('m'),foodId:x.foodId,name:x.name.trim(),qty:x.qty||1,slot,kcal:x.kcal,p:x.p,hc:x.hc||0,gr:x.gr||0,fib:x.fib,ai:true})),today());
    toast(`${it.length} ${it.length===1?'alimento añadido':'alimentos añadidos'} a hoy`)},
  wReset:()=>{const w=day(today()).water||0;if(!w)return;document.getElementById('wreset').innerHTML=`<div class="warn" role="alert"><b>⚠ ¿Resetear el agua de hoy?</b><span>Se borrarán los ${fmt1(w/1000)} L que llevas registrados y el contador volverá a 0.</span><div class="btnrow"><button class="btn" data-act="wResetNo">Cancelar</button><button class="btn danger-fill" data-act="wResetYes">Sí, resetear</button></div></div>`},
  wResetNo:()=>{document.getElementById('wreset').innerHTML=wResetBtn(day(today()).water||0)},
  wResetYes:()=>{const tk=today(),prev=day(tk).water||0;updDay(d=>{d.water=0},tk);
    toast(`Agua de hoy reseteada (${fmt1(prev/1000)} L)`,{label:'Deshacer',fn:()=>updDay(d=>{d.water=prev},tk)})},
  goDay:t=>{S.date=t.dataset.v;S.tab='hoy';render();scrollTo(0,0)},
  bkSave:()=>bkSave(),
  bkNo:()=>{S.pendingRestore=null;document.getElementById('bkOut').innerHTML=''},
  bkYes:()=>bkApply(),
  bkCopy:()=>{const t=document.getElementById('bkTxt');if(!t)return;const done=()=>toast('Copiado');try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast('Selecciona y copia el texto')})}catch(e){t.select()}},
  retryImg:()=>{setNoImg(false);openPhoto()},
  goImport:()=>{S.tab='progreso';render();setTimeout(()=>{const b=document.getElementById('bkIn');b&&b.scrollIntoView({block:'center'});b&&b.click()},50)},
  aiSave:()=>{try{const k=val('aiK').trim();k?localStorage.setItem('midia:_aiKey',k):localStorage.removeItem('midia:_aiKey');localStorage.setItem('midia:_aiModel',val('aiM'))}catch(e){}toast('Clave guardada en este dispositivo')},
  aiTestGo:async()=>{A.aiSave();const o=document.getElementById('aiTest');o.innerHTML='<div class="thinking"><i></i><span>Probando…</span></div>';
    try{await aiCall('Responde solo: ok',{max:5});o.innerHTML='<p class="note" style="color:var(--ok)">La clave funciona.</p>'}catch(e){o.innerHTML=`<p class="note" style="color:var(--warn)">${esc(aiErr(e)||'Error')}</p>`}},
  logout:()=>logout(),
  bkPick:()=>document.getElementById('bkIn')&&document.getElementById('bkIn').click(),
  toastAct:()=>{const f=toast._fn;document.getElementById('toastHost').innerHTML='';toast._fn=null;if(f)f()},
  prev:()=>{S.date=addDays(S.date,-1);render()},
  next:()=>{if(S.date<today()){S.date=addDays(S.date,1);render()}},
  today:(t,e)=>{e.preventDefault();S.date=today();render()},
  close:closeSheet,
  water:t=>updDay(d=>{d.water=Math.max(0,(d.water||0)+Number(t.dataset.v))},t.dataset.k||S.date),
  homeDay:t=>{S.homeDay=t.dataset.v;render()},
  chk:t=>updDay(d=>{const id=t.dataset.id;if(d.checks[id])delete d.checks[id];else d.checks[id]=true},t.dataset.k||S.date),
  addFood:t=>{const f=S.foods.find(x=>x.id===t.dataset.id);if(!f)return;if(f.kcal==null)openFoodEdit(f.id,true);else openQty(f)},
  q:t=>{sheetCtx.qty=Number(t.dataset.v);document.querySelectorAll('#qseg button').forEach(b=>b.classList.toggle('on',b===t))},
  qtyAdd:()=>{const {food:f,qty}=sheetCtx;const slot=val('qslot'),g=num(val('qg'));closeSheet();
    const o=portion(f,qty,g&&g>0?g:null);
    updDay(d=>d.meals.push({id:uid('m'),foodId:f.id,name:f.name,slot,...o}));toast(`${f.name} añadido`)},
  fcat:t=>{S.fcat=t.dataset.v;S.fq='';render()},
  howDay:()=>howDay(),
  aiMem:()=>openAiMem(),
  aiMemSave:()=>{const lines=id=>val(id).split('\n').map(x=>x.trim()).filter(Boolean);S.ai={rules:lines('am-r'),typical:lines('am-t'),notes:lines('am-n')};save('cfg/ai',S.ai);closeSheet();toast('Memoria de la IA guardada')},
  delMeal:t=>updDay(d=>{d.meals=d.meals.filter(m=>m.id!==t.dataset.id)}),
  foods:openFoods,
  foodNew:()=>openFoodEdit(null,false),
  foodEdit:t=>openFoodEdit(t.dataset.id,false),
  foodSave:()=>{const v=readFood();if(!v.name||v.kcal==null){toast('Pon al menos nombre y kcal');return}
    const {id,thenAdd,extra}=sheetCtx;let f;
    if(id){f=S.foods.find(x=>x.id===id);Object.assign(f,v);if(f.kcal!=null)delete f.pantry}else{f={id:uid('f'),...v,...(extra||{})};S.foods.push(f)}
    if(extra){saveFoods();closeSheet();render();toast(`${f.name} guardado en tus alimentos`);return}
    saveFoods();render();if(thenAdd)openQty(f);else openFoods()},
  foodDel:()=>{if(sheetCtx.confirm!==true){sheetCtx.confirm=true;const b=document.querySelector('[data-act="foodDel"]');b.textContent='¿Seguro? Toca otra vez';return}
    S.foods=S.foods.filter(x=>x.id!==sheetCtx.id);saveFoods();render();openFoods()},
  manual:openManual,
  manualSave:()=>{const v=readFood();if(!v.name||v.kcal==null){toast('Pon al menos nombre y kcal');return}
    const slot=val('mslot'),keep=document.getElementById('mkeep').checked;let fid=null;
    if(keep){const f={id:uid('f'),freq:'habitual',...v};S.foods.push(f);fid=f.id;saveFoods()}
    closeSheet();updDay(d=>d.meals.push({id:uid('m'),foodId:fid,name:v.name,qty:1,slot,kcal:v.kcal,p:v.p||0,hc:v.hc||0,gr:v.gr||0,fib:v.fib||0}));toast(`${v.name} añadido`)},
  steps:t=>updDay(d=>{d.steps=(d.steps||0)+Number(t.dataset.v)}),
  workout:t=>openWorkout(t.dataset.v),
  wSave:()=>{const w={id:uid('w'),type:sheetCtx.type,name:val('wn').trim(),min:num(val('wm'))||0,kcal:num(val('wk'))||0,note:val('wo').trim()};
    if(!w.min&&!w.name){toast('Pon al menos los minutos');return}closeSheet();updDay(d=>d.workouts.push(w));toast('Entreno guardado')},
  delW:t=>updDay(d=>{d.workouts=d.workouts.filter(w=>w.id!==t.dataset.id)}),
  goals:openGoals,
  goalsSave:()=>{const g={kcal:num(val('gk'))||DEF_GOALS.kcal,p:num(val('gp'))||DEF_GOALS.p,fib:num(val('gf'))||DEF_GOALS.fib,hc:num(val('gh'))||DEF_GOALS.hc,fat:num(val('gfa'))||DEF_GOALS.fat,water:Math.round((num(val('gw'))||3)*1000),steps:num(val('gs'))||DEF_GOALS.steps,start:/^\d{4}-\d{2}-\d{2}$/.test(val('gst'))?val('gst'):(S.goals.start||DEF_GOALS.start)};
    S.goals=g;save('cfg/goals',g);closeSheet();render();toast('Objetivos guardados')},
  clEdit:openCl,
  clAdd:()=>{clSync();sheetCtx.items.push({id:uid('c'),label:'',days:null});document.getElementById('clList').innerHTML=clRows();const e=document.getElementById('cl-'+(sheetCtx.items.length-1));e&&e.focus()},
  clDel:t=>{clSync();sheetCtx.items.splice(Number(t.dataset.i),1);document.getElementById('clList').innerHTML=clRows()},
  clDay:t=>{clSync();const c=sheetCtx.items[Number(t.dataset.i)],n=Number(t.dataset.v);let ds=c.days&&c.days.length?[...c.days]:[0,1,2,3,4,5,6];
    ds=ds.includes(n)?ds.filter(x=>x!==n):[...ds,n];c.days=ds.length===7?null:ds;if(!ds.length)c.days=[n===1?2:1];document.getElementById('clList').innerHTML=clRows()},
  clSave:()=>{clSync();S.checklist=sheetCtx.items.filter(c=>c.label.trim()).map(c=>({...c,label:c.label.trim()}));save('cfg/checklist',{items:S.checklist});closeSheet();render();toast('Checklist guardada')}
};
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='lgForm')doLogin(e)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f)f(t,e)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bkIn'){const f=t.files&&t.files[0];if(f)bkRead(f);t.value='';return}
  if((t.id==='phIn'||t.id==='scIn')&&sheetCtx){const fs=[...(t.files||[])].slice(0,t.id==='scIn'?2:1);if(!fs.length)return;sheetCtx.files=fs;
    document.getElementById(t.id==='phIn'?'phZone':'scZone').innerHTML=zoneHtml(fs);return}
  if(!t.dataset||!t.dataset.chg)return;
  if(t.dataset.chg==='steps'){const v=Math.max(0,Math.round(num(t.value)||0));updDay(d=>{d.steps=v})}
  if(t.dataset.chg==='weight'){const v=num(t.value);updDay(d=>{d.weight=v&&v>30&&v<400?v:null;const c=S.checklist.find(x=>x.weigh);if(c){if(d.weight!=null)d.checks[c.id]=true}},t.dataset.k||S.date);if(v)toast('Peso guardado')}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='fq'){S.fq=t.value;const g=document.getElementById('fgrid');if(g)g.innerHTML=gridHtml();document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',!S.fq&&b.dataset.v===S.fcat))}
  if(t.id==='mfq'){document.getElementById('mfl').innerHTML=foodsRows(t.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetCtx)closeSheet()});
// cambio de día a medianoche si la app sigue abierta
let lastToday=today();setInterval(()=>{const t=today();if(t!==lastToday){if(S.date===lastToday)S.date=t;lastToday=t;render()}
  if(slotNow()!==S.quote.slot&&!sheetCtx){S.quote=pickQuote();if(S.tab==='inicio')render()}},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.tab==='inicio'&&!sheetCtx&&!S.anim){S.quote=pickQuote();render()}});

loadLocal();render();connect();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sess)pull()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>

</body>
</html>
